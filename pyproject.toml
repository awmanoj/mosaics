[project]
name = "mosaic"
version = "0.1.0"
description = "Simulating Decorative Mosaics (Hausner, SIGGRAPH 2001) — CPU implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pillow>=10.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
mosaic = "mosaic.cli:app"
mosaic-web = "mosaic.web.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic"]

[dependency-groups]
dev = ["pytest>=8"]

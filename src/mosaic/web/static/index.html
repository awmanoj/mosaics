<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaic</title>
<style>
  :root { --bg:#f3f1ec; --fg:#1d1c1a; --muted:#77736c; --line:#dcd8cf; --accent:#b4432f; --panel:#fff; --shadow:0 1px 2px #0001, 0 8px 24px #0000000d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141311; --fg:#ece8df; --muted:#9a958b; --line:#2d2b27; --accent:#e0664f; --panel:#1e1d1a; --shadow:0 1px 2px #0006, 0 8px 24px #0004; }
  }
  * { box-sizing:border-box }
  [hidden] { display:none !important }
  html, body { height:100% }
  body { margin:0; font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background:var(--bg); color:var(--fg);
         display:grid; grid-template-rows:auto 1fr; }
  header { padding:14px 24px; display:flex; align-items:baseline; gap:12px; border-bottom:1px solid var(--line); flex-wrap:wrap }
  header h1 { margin:0; font-size:18px; font-weight:600; letter-spacing:.02em }
  header span { color:var(--muted); font-size:13px }
  header .credit { margin-left:auto; color:var(--muted); font-size:13px }
  header .credit a { color:var(--accent); text-decoration:none; font-weight:500 }
  header .credit a:hover { text-decoration:underline }
  main { display:grid; grid-template-columns:290px 1fr; gap:20px; padding:20px 24px; min-height:0 }
  @media (max-width:820px) { main { grid-template-columns:1fr; overflow:auto } }

  /* ---- controls ---- */
  aside { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; box-shadow:var(--shadow); overflow:auto; align-self:start; max-height:100% }
  .drop { border:1.5px dashed var(--line); border-radius:10px; padding:18px 12px; text-align:center; color:var(--muted); cursor:pointer; transition:border-color .15s, background .15s; display:flex; flex-direction:column; align-items:center; gap:6px }
  .drop.over, .drop:hover { border-color:var(--accent); background:#b4432f0a }
  .drop .name { color:var(--fg); font-weight:500; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .drop small { font-size:12px }
  label { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-top:12px }
  label b { color:var(--fg); font-weight:500; font-variant-numeric:tabular-nums }
  input[type=range] { width:100%; margin:4px 0 0; accent-color:var(--accent) }
  select, input[type=color], input[type=number] { width:100%; margin-top:4px; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit }
  input[type=color] { height:33px; padding:2px }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px }
  details { margin-top:12px; border-top:1px solid var(--line); padding-top:4px }
  summary { cursor:pointer; color:var(--muted); font-size:13px; padding:6px 0; list-style:none; display:flex; justify-content:space-between }
  summary::after { content:"+" } details[open] summary::after { content:"–" }
  button { margin-top:16px; width:100%; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer; position:relative; overflow:hidden }
  button:disabled { cursor:default; opacity:.85 }
  button .bar { position:absolute; left:0; top:0; bottom:0; width:0; background:#fff3; transition:width .3s }
  .status { font-size:12px; color:var(--muted); margin-top:8px; min-height:16px; display:flex; justify-content:space-between }
  a.dl { color:var(--accent); text-decoration:none; font-weight:500 }

  /* ---- viewer ---- */
  .viewer { position:relative; min-height:0; display:flex; align-items:center; justify-content:center }
  .empty { border:1.5px dashed var(--line); border-radius:12px; width:100%; height:100%; min-height:320px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted); gap:8px; cursor:pointer }
  .empty:hover, .empty.over { border-color:var(--accent) }
  .empty strong { color:var(--fg); font-weight:500; font-size:15px }
  .stage { position:relative; max-width:100%; max-height:100%; border-radius:10px; overflow:hidden; box-shadow:var(--shadow); background:#8882; user-select:none; -webkit-user-select:none; touch-action:none; cursor:ew-resize }
  .stage.single { cursor:default }
  .stage img { display:block; max-width:100%; max-height:calc(100vh - 110px); width:auto; height:auto; pointer-events:none; -webkit-user-drag:none; user-drag:none }
  .stage .orig { position:absolute; inset:0; width:100%; height:100%; max-height:none; object-fit:fill; clip-path:inset(0 calc(100% - var(--x, 50%)) 0 0); will-change:clip-path }
  .stage .handle { position:absolute; top:0; bottom:0; left:var(--x, 50%); width:0; border-left:2px solid #fff; box-shadow:0 0 0 1px #0004; pointer-events:none }
  .stage .handle::after { content:"⇔"; position:absolute; top:50%; left:0; transform:translate(-50%,-50%); width:34px; height:34px; border-radius:50%; background:#fff; color:#222; display:flex; align-items:center; justify-content:center; font-size:16px; box-shadow:0 2px 8px #0004 }
  .stage .tag { position:absolute; top:10px; padding:3px 8px; border-radius:6px; background:#000a; color:#fff; font-size:11px; letter-spacing:.04em; text-transform:uppercase; pointer-events:none }
  .stage .tag.l { left:10px } .stage .tag.r { right:10px }
  .stage.busy::before { content:""; position:absolute; inset:0; background:#0003; z-index:2 }
  .stage.single .orig, .stage.single .handle, .stage.single .tag { display:none }
  .hint { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--muted); background:var(--panel); padding:4px 10px; border-radius:20px; box-shadow:var(--shadow); pointer-events:none }
</style>
</head>
<body>
<header>
  <h1>Mosaic</h1><span>square tiles that follow the edges of your picture · drop, paste or pick an image</span>
  <span class="credit">Based on Hausner, <a href="https://doi.org/10.1145/383259.383327" target="_blank" rel="noopener"><em>Simulating Decorative Mosaics</em></a>, SIGGRAPH 2001</span>
</header>
<main>
  <aside>
    <form id="form">
      <div class="drop" id="drop">
        <input type="file" id="file" name="image" accept="image/*" hidden>
        <div class="name" id="dropText">Choose an image</div>
        <small>drop, paste, or click</small>
      </div>

      <label><span>Tiles</span><b id="v_tiles">2000</b></label>
      <input type="range" name="tiles" min="200" max="8000" step="100" value="2000">

      <label><span>Iterations</span><b id="v_iters">30</b></label>
      <input type="range" name="iters" min="5" max="100" step="5" value="30">

      <label><span>Tile fill</span><b id="v_fill">0.8</b></label>
      <input type="range" name="fill" min="0.4" max="1.1" step="0.05" value="0.8">

      <label><span>Detail tiles near edges</span><b id="v_detail_scale">1</b></label>
      <input type="range" name="detail_scale" min="0.3" max="1" step="0.05" value="1">

      <label><span>Edge sensitivity (blur σ)</span><b id="v_edge_sigma">2</b></label>
      <input type="range" name="edge_sigma" min="1" max="6" step="0.5" value="2">

      <details>
        <summary>More options</summary>
        <label><span>Aspect (elongate along edges)</span><b id="v_aspect">1</b></label>
        <input type="range" name="aspect" min="0.5" max="3" step="0.1" value="1">
        <label><span>Edge gap width</span><b id="v_edge_width">0.3</b></label>
        <input type="range" name="edge_width" min="0" max="1" step="0.05" value="0.3">
        <label><span>Bevel</span><b id="v_bevel">0</b></label>
        <input type="range" name="bevel" min="0" max="1" step="0.05" value="0">
        <label><span>Colour jitter</span><b id="v_jitter">0</b></label>
        <input type="range" name="jitter" min="0" max="0.5" step="0.05" value="0">
        <label><span>Working resolution</span><b id="v_max_size">800</b></label>
        <input type="range" name="max_size" min="300" max="1400" step="100" value="800">
        <div class="row">
          <div><label><span>Colour</span></label>
            <select name="color"><option value="mean">region mean</option><option value="point">point sample</option></select></div>
          <div><label><span>Style</span></label>
            <select name="style"><option value="tiles">tiles</option><option value="voronoi">voronoi</option></select></div>
        </div>
        <div class="row">
          <div><label><span>Grout</span></label><input type="color" name="grout" value="#282828"></div>
          <div><label><span>Seed</span></label><input type="number" name="seed" value="0"></div>
        </div>
        <label><span>Edge mask (optional, white = edge)</span></label>
        <input type="file" name="edges" accept="image/*" style="font-size:12px;margin-top:4px">
      </details>

      <button type="submit" id="go" disabled><div class="bar" id="bar"></div><span id="goText">Make mosaic</span></button>
      <div class="status"><span id="status"></span><a class="dl" id="dl" hidden download="mosaic.png">download PNG</a></div>
    </form>
  </aside>

  <section class="viewer" id="viewer">
    <div class="empty" id="empty"><strong>Drop an image here</strong><span>or paste one, or click to choose</span></div>
    <div class="stage single" id="stage" hidden>
      <img id="out" alt="mosaic" draggable="false">
      <img id="orig" class="orig" alt="original" draggable="false">
      <div class="handle"></div>
      <span class="tag l">original</span><span class="tag r">mosaic</span>
    </div>
    <div class="hint" id="hint" hidden>drag to compare</div>
  </section>
</main>
<script>
  const $ = id => document.getElementById(id);
  const form = $('form'), file = $('file'), go = $('go'), status = $('status'), stage = $('stage');
  let haveResult = false;

  for (const r of form.querySelectorAll('input[type=range]')) {
    const show = () => { const v = $('v_' + r.name); if (v) v.textContent = r.value; };
    r.addEventListener('input', show); show();
  }

  function setFile(f) {
    if (!f || !f.type.startsWith('image/')) return;
    const dt = new DataTransfer(); dt.items.add(f); file.files = dt.files;
    $('dropText').textContent = f.name;
    const url = URL.createObjectURL(f);
    $('orig').src = url; $('out').src = url;           // show the original until the mosaic arrives
    stage.classList.add('single'); haveResult = false;
    $('empty').hidden = true; stage.hidden = false; $('hint').hidden = true; $('dl').hidden = true;
    go.disabled = false;
    run();
  }
  const pick = () => file.click();
  $('drop').addEventListener('click', pick);
  $('empty').addEventListener('click', pick);
  file.addEventListener('change', () => setFile(file.files[0]));
  for (const el of [$('drop'), $('empty'), $('viewer')]) {
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); setFile(e.dataTransfer.files[0]); });
  }
  document.addEventListener('paste', e => { const it = [...e.clipboardData.items].find(i => i.type.startsWith('image/')); if (it) setFile(it.getAsFile()); });

  // before/after slider
  function setX(clientX) {
    const r = stage.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    stage.style.setProperty('--x', (x * 100).toFixed(2) + '%');
  }
  let dragging = false;
  stage.addEventListener('dragstart', e => e.preventDefault());
  stage.addEventListener('pointerdown', e => { if (!haveResult) return; e.preventDefault(); dragging = true; stage.setPointerCapture(e.pointerId); setX(e.clientX); });
  stage.addEventListener('pointermove', e => { if (dragging) setX(e.clientX); });
  stage.addEventListener('pointerup', () => dragging = false);
  stage.addEventListener('pointercancel', () => dragging = false);
  stage.addEventListener('lostpointercapture', () => dragging = false);

  let timer, t0, busy = false;
  async function run() {
    if (busy || !file.files.length) return;
    busy = true; go.disabled = true; t0 = Date.now();
    stage.classList.add('busy');
    const expected = 2000 + Number(form.tiles.value) * Number(form.iters.value) / 25;   // rough ms guess
    timer = setInterval(() => {
      const t = Date.now() - t0;
      $('bar').style.width = Math.min(95, 100 * t / expected) + '%';
      $('goText').textContent = `working… ${(t / 1000).toFixed(0)}s`;
    }, 200);
    try {
      const res = await fetch('/mosaic', { method:'POST', body: new FormData(form) });
      if (!res.ok) throw new Error(await res.text());
      const blob = await res.blob(), url = URL.createObjectURL(blob);
      const name = res.headers.get('X-Name') || 'mosaic.png';
      $('out').src = url; $('dl').href = url; $('dl').download = name; $('dl').textContent = 'download ' + name; $('dl').hidden = false;
      stage.classList.remove('single'); stage.style.setProperty('--x', '0%'); haveResult = true;
      $('hint').hidden = false; setTimeout(() => $('hint').hidden = true, 2500);
      status.textContent = `${res.headers.get('X-Tiles')} tiles · ${((Date.now()-t0)/1000).toFixed(1)}s`;
    } catch (err) {
      status.textContent = 'error: ' + err.message;
    } finally {
      clearInterval(timer); busy = false; go.disabled = false; stage.classList.remove('busy');
      $('bar').style.width = '0'; $('goText').textContent = 'Make mosaic';
    }
  }
  form.addEventListener('submit', e => { e.preventDefault(); run(); });
</script>
</body>
</html>
